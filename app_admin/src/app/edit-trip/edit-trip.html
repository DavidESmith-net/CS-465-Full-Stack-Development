<div class="container mt-4 mb-5">
  <div class="row">
    <div class="col-md-8 offset-md-2">
      <h2 class="mb-4">Edit Trip</h2>
      
      <form [formGroup]="editForm" (ngSubmit)="onSubmit()">
        
        <div class="form-group mb-3">
          <label for="code" class="form-label">Trip Code:</label>
          <!-- We make the code readonly because it is our unique identifier -->
          <input type="text" id="code" formControlName="code" class="form-control" readonly>
        </div>

        <div class="form-group mb-3">
          <label for="name" class="form-label">Trip Name:</label>
          <input type="text" id="name" formControlName="name" class="form-control">
        </div>

        <div class="form-group mb-3">
          <label for="length" class="form-label">Length:</label>
          <input type="text" id="length" formControlName="length" class="form-control">
        </div>

        <div class="form-group mb-3">
          <label for="start" class="form-label">Start Date:</label>
          <input type="date" id="start" formControlName="start" class="form-control">
        </div>

        <div class="form-group mb-3">
          <label for="resort" class="form-label">Resort:</label>
          <input type="text" id="resort" formControlName="resort" class="form-control">
        </div>

        <div class="form-group mb-3">
          <label for="perPerson" class="form-label">Per Person Cost:</label>
          <input type="text" id="perPerson" formControlName="perPerson" class="form-control">
        </div>

        <div class="form-group mb-3">
          <label for="image" class="form-label">Image Filename:</label>
          <input type="text" id="image" formControlName="image" class="form-control">
        </div>

        <div class="form-group mb-4">
          <label for="description" class="form-label">Description:</label>
          <textarea id="description" formControlName="description" class="form-control" rows="4"></textarea>
        </div>

        <button type="submit" class="btn btn-primary" [disabled]="!editForm.valid">Update Trip</button>
      
      </form>
    </div>
  </div>
</div>
