<div class="row mt-4">
  <div class="col-12 col-md-8 offset-md-2">
    <h2 class="mb-4">Login</h2>
    <form (ngSubmit)="onLoginSubmit()">
      <div role="alert" *ngIf="formError" class="alert alert-danger">
        {{ formError }}
      </div>
      <div class="form-group mb-3">
        <label for="name">Name</label>
        <input type="text" class="form-control" name="name" placeholder="Enter Name" [(ngModel)]="credentials.name">
      </div>
      <div class="form-group mb-3">
        <label for="email">Email Address</label>
        <input type="email" class="form-control" name="email" placeholder="Enter email address" [(ngModel)]="credentials.email">
      </div>
      <div class="form-group mb-4">
        <label for="password">Password</label>
        <input type="password" class="form-control" id="password" name="password" placeholder="Password" [(ngModel)]="credentials.password">
      </div>
      <button type="submit" role="button" class="btn btn-primary">Sign In!</button>
    </form>
  </div>
</div>
